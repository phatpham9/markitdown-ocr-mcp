[project]
name = "markitdown-ocr-mcp"
version = "0.1.0"
description = "Thin MCP wrapper exposing MarkItDown + markitdown-ocr (LLM vision) with oMLX/GLM-OCR to Claude Code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0,<3",
    "markitdown>=0.1.7,<0.2",
    "markitdown-ocr>=0.1.0",
    "openai>=1.0.0",
    "pymupdf>=1.24.0",
]

[project.scripts]
markitdown-ocr-mcp = "markitdown_ocr_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/markitdown_ocr_mcp"]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.9.0"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
